<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080D18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RESQFLOW AI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>RESQFLOW AI — Autonomous Emergency Response &amp; Supply Chain Intelligence</title>
    <meta
      name="description"
      content="Autonomous Emergency Response & Supply Chain Intelligence Network — Predict risks, coordinate resources, deliver relief, save lives."
    />
    <meta property="og:title" content="RESQFLOW AI — Emergency Response & Supply Chain Intelligence" />
    <meta
      property="og:description"
      content="Real-time disaster intelligence, deterministic risk assessment, resource allocation, route optimization, and human-controlled relief coordination."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('resqflow_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F7FB] text-[#111827] dark:bg-[#080D18] dark:text-[#F1F5F9] antialiased selection:bg-[#6D7CFF]/25 selection:text-[#6D7CFF] dark:selection:text-[#8190FF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
